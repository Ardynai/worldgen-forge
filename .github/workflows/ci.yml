name: CI

# What a hosted runner can verify without a GPU, model weights or secrets:
# compile, then the stub-backend test suite. Lab CI-DOCTRINE.md
# (locus-evolution-lab private/standards/), adopted 2026-10-19.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Install package and pytest
        run: python -m pip install -e . "pytest==9.1.1"
      - name: Compile
        run: python -m compileall -q terminalia custom_nodes tests
      - name: Tests (stub backends; no GPU, no network)
        run: python -m pytest -q tests

  workflow-doctrine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: node scripts/ci/check-workflow-doctrine.mjs

  # The one check to require: every job above must succeed; skipped or
  # cancelled counts as failure. A new gating job goes in needs: only.
  ci-green:
    name: CI green
    if: ${{ always() }}
    needs: [tests, workflow-doctrine]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every gating job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | length > 0 and all(.value.result == "success")' > /dev/null
